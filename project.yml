name: tapeze
options:
  bundleIdPrefix: com.gm2211
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "34"

targets:
  tapeze:
    type: application
    platform: iOS
    sources:
      - path: tapeze
      - path: tapezeKeyboard/KeyboardView.swift
      - path: tapezeKeyboard/KeyView.swift
      - path: tapezeKeyboard/KeyboardLayout.swift
      - path: tapezeKeyboard/KeyboardState.swift
      - path: tapezeKeyboard/GestureEngine.swift
    resources:
      - path: tapeze/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gm2211.tapeze
        INFOPLIST_FILE: tapeze/Info.plist
        CODE_SIGN_ENTITLEMENTS: tapeze/tapeze.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6KQV68SJ5P
    dependencies:
      - target: tapezeKeyboard

  tapezeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: tapezeKeyboard
    resources:
      - path: tapezeKeyboard/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gm2211.tapeze.keyboard
        INFOPLIST_FILE: tapezeKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: tapezeKeyboard/tapezeKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6KQV68SJ5P
        ENABLE_DEBUG_DYLIB: "NO"
        SKIP_INSTALL: "YES"
