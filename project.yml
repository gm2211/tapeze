name: Tapeze
options:
  bundleIdPrefix: com.gmecocci
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Tapeze:
    type: application
    platform: iOS
    sources:
      - path: Tapeze
    resources:
      - path: Tapeze/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmecocci.tapeze
        INFOPLIST_FILE: Tapeze/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tapeze/Tapeze.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6KQV68SJ5P
    dependencies:
      - target: TapezeKeyboard

  TapezeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: TapezeKeyboard
    resources:
      - path: TapezeKeyboard/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmecocci.tapeze.keyboard
        INFOPLIST_FILE: TapezeKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: TapezeKeyboard/TapezeKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6KQV68SJ5P
        ENABLE_DEBUG_DYLIB: "NO"
        SKIP_INSTALL: "YES"
